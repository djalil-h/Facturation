name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Install ImageMagick
        shell: pwsh
        run: |
          choco install imagemagick.app --no-progress -y
          $env:Path += ";C:\Program Files\ImageMagick-*"
          $magick = Get-Command magick.exe -ErrorAction SilentlyContinue
          if (-not $magick) { throw "ImageMagick was not found after installation." }
          magick --version

      - name: Create Windows icon from Hamzaoui SVG
        shell: pwsh
        run: |
          magick assets/hamzaoui_logo.svg -background none -define icon:auto-resize=16,24,32,48,64,128,256 assets/hamzaoui_logo.ico
          if (-not (Test-Path assets/hamzaoui_logo.ico)) { throw "Windows icon was not created." }

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name HamzaouiFacturation --icon assets/hamzaoui_logo.ico --add-data "assets;assets" main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\HamzaouiFacturation.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamzaoui-Facturation-Installer
          path: installer/output/Hamzaoui-Facturation-Setup-v1.0.0.exe
          if-no-files-found: error
